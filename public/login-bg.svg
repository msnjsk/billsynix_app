<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" preserveAspectRatio="xMidYMid slice">
  <!-- BillSynix login background: brand gradient, soft light, grid and store-shelf line art. -->
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151a3a"/>
      <stop offset="0.55" stop-color="#1f1b4d"/>
      <stop offset="1" stop-color="#2a1458"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="90"/>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <radialGradient id="fade" cx="0.5" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#05061a" stop-opacity="0.55"/>
    </radialGradient>
    <linearGradient id="shelfFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>
    <mask id="shelfMask">
      <rect x="0" y="1000" width="1200" height="600" fill="url(#shelfFade)"/>
    </mask>
  </defs>

  <rect width="1200" height="1600" fill="url(#base)"/>

  <!-- light -->
  <g filter="url(#blur)">
    <circle cx="210" cy="260" r="260" fill="#4f46e5" opacity="0.75"/>
    <circle cx="1020" cy="520" r="280" fill="#8b5cf6" opacity="0.55"/>
    <circle cx="560" cy="1180" r="300" fill="#06b6d4" opacity="0.28"/>
    <circle cx="1080" cy="1380" r="220" fill="#ec4899" opacity="0.22"/>
  </g>

  <rect width="1200" height="1600" fill="url(#grid)"/>

  <!-- store shelves line art, fading in toward the bottom -->
  <g mask="url(#shelfMask)" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="2" stroke-linejoin="round">
    <!-- uprights -->
    <path d="M60 1040V1600M1140 1040V1600"/>
    <!-- shelf 1 -->
    <path d="M60 1180H1140"/>
    <rect x="96" y="1092" width="70" height="88" rx="6"/><rect x="176" y="1110" width="70" height="70" rx="6"/>
    <path d="M276 1180v-64q0-14 14-14h28q14 0 14 14v64M290 1102v-18h28v18"/>
    <rect x="362" y="1096" width="96" height="84" rx="8"/><path d="M362 1124h96"/>
    <path d="M490 1180v-56a28 28 0 0 1 56 0v56M498 1124h40"/>
    <rect x="580" y="1084" width="62" height="96" rx="6"/><rect x="652" y="1104" width="62" height="76" rx="6"/>
    <path d="M748 1180v-70q0-10 10-10h36q10 0 10 10v70M766 1100v-16h20v16"/>
    <rect x="840" y="1092" width="110" height="88" rx="10"/><path d="M856 1120h78M856 1140h60"/>
    <path d="M980 1180v-60a24 24 0 0 1 48 0v60M1040 1180v-80h70v80"/>
    <!-- shelf 2 -->
    <path d="M60 1360H1140"/>
    <path d="M96 1360v-84q0-12 12-12h40q12 0 12 12v84M112 1264v-22h32v22"/>
    <rect x="190" y="1270" width="120" height="90" rx="10"/><path d="M206 1300h88"/>
    <rect x="336" y="1250" width="66" height="110" rx="6"/><rect x="412" y="1276" width="66" height="84" rx="6"/>
    <path d="M512 1360v-62a30 30 0 0 1 60 0v62M592 1360v-62a30 30 0 0 1 60 0v62"/>
    <rect x="684" y="1262" width="100" height="98" rx="8"/><path d="M700 1292h68M700 1312h50"/>
    <path d="M816 1360v-90q0-12 12-12h30q12 0 12 12v90M832 1258v-20h22v20"/>
    <rect x="904" y="1280" width="96" height="80" rx="8"/><rect x="1018" y="1256" width="90" height="104" rx="8"/>
    <!-- shelf 3 -->
    <path d="M60 1540H1140"/>
    <rect x="96" y="1442" width="150" height="98" rx="12"/><path d="M116 1476h110M116 1498h80"/>
    <path d="M276 1540v-70a32 32 0 0 1 64 0v70M356 1540v-70a32 32 0 0 1 64 0v70"/>
    <rect x="452" y="1430" width="80" height="110" rx="8"/><rect x="544" y="1452" width="80" height="88" rx="8"/>
    <path d="M660 1540v-86q0-12 12-12h36q12 0 12 12v86M676 1442v-20h28v20"/>
    <rect x="756" y="1446" width="130" height="94" rx="10"/><path d="M772 1478h98"/>
    <rect x="910" y="1436" width="88" height="104" rx="8"/><path d="M1024 1540v-64a30 30 0 0 1 60 0v64"/>
  </g>

  <rect width="1200" height="1600" fill="url(#fade)"/>
</svg>
