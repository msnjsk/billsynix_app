name: Backend CI

on:
  push:
    paths: ['backend/**', '.github/workflows/backend-ci.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend-ci.yml']

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: billing
          POSTGRES_PASSWORD: billing
          POSTGRES_DB: billing_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U billing -d billing_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # Migrations as the owner; the app and tests as the row-level-security-bound role.
      DATABASE_URL: postgresql://billing_app:billing_app@localhost:5432/billing_test?schema=public
      DIRECT_URL: postgresql://billing:billing@localhost:5432/billing_test?schema=public
      TEST_DATABASE_URL: postgresql://billing_app:billing_app@localhost:5432/billing_test?schema=public
      TEST_DIRECT_URL: postgresql://billing:billing@localhost:5432/billing_test?schema=public
      JWT_ACCESS_SECRET: ci-only-access-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Create the least-privilege app role
        run: |
          PGPASSWORD=billing psql -h localhost -U billing -d billing_test -v ON_ERROR_STOP=1 -f docker/initdb/app-role.psql
      - name: Lint
        run: npm run lint
      - name: Formatting
        run: npm run format:check
      - name: Type-check
        run: npm run typecheck
      - name: Migrations apply cleanly and match the schema
        run: |
          npx prisma migrate deploy
          npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - name: Unit tests
        run: npm test
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t billing-backend:ci .
